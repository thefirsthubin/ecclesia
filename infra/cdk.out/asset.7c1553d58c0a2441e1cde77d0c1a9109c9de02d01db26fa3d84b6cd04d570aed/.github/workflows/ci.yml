name: CI

# Sprint 1.0 - Repository Protection (guardrail, not a feature milestone).
#
# Runs the exact same gate documented in the README's "Getting started"
# section (pnpm install, lint, test, build) against a clean checkout on
# every push and pull request. This exists because Sprint 0's repair work
# repeatedly found that "passes on a developer's machine" and "passes from
# a clean install" are not the same claim - stale local state, missing
# dependencies, and version drift all slipped through manual verification
# and were only caught by actually running the full sequence from scratch.
# CI is that verification, automated, on every change instead of only when
# something has already broken.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes during review don't
# queue up redundant work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the "packageManager" field in package.json (pnpm@9.12.0) -
      # one source of truth for the version, matching the README's own
      # `corepack prepare pnpm@9.12.0 --activate` instructions.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
