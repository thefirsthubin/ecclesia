name: CI

# Sprint 1.0 - Repository Protection (guardrail, not a feature milestone).
#
# Runs the exact same gate documented in the README's "Getting started"
# section (pnpm install, typecheck, lint, test, build) against a clean
# checkout on every push and pull request. This exists because Sprint 0's
# repair work repeatedly found that "passes on a developer's machine" and
# "passes from a clean install" are not the same claim - stale local
# state, missing dependencies, and version drift all slipped through
# manual verification and were only caught by actually running the full
# sequence from scratch. CI is that verification, automated, on every
# change instead of only when something has already broken.
#
# Typecheck added once `pnpm typecheck` became real (previously wired to
# a broken invocation that silently checked zero files workspace-wide -
# see the `Typecheck` step's own comment below).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes during review don't
# queue up redundant work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the "packageManager" field in package.json (pnpm@9.12.0) -
      # one source of truth for the version, matching the README's own
      # `corepack prepare pnpm@9.12.0 --activate` instructions.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@prisma/client`'s own postinstall script runs `prisma generate`
      # automatically, but relying on that alone is fragile against
      # `actions/setup-node`'s pnpm store cache above: on a cache hit,
      # pnpm can skip re-running a package's postinstall (it already
      # considers the package "built"), leaving `node_modules/@prisma/client`
      # an ungenerated stub - `PrismaClient`/`Prisma`/every model type
      # missing, exactly the failure this step exists to make impossible
      # regardless of cache state. `pnpm exec` (this repo's own convention
      # everywhere else in this file, not `npx`) + an explicit
      # `--schema=db/schema.prisma` (matching package.json's own `"prisma":
      # { "schema": "db/schema.prisma" }` config, not relying on it) - so
      # this step's correctness never depends on reading a second file.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=db/schema.prisma

      # `pnpm typecheck` (nx run-many --target=typecheck --all) - the
      # `@nx/js/typescript` plugin's `tsc --build` target, correctly
      # resolving TS project references. Previously ran nothing: `tsc -p
      # <project>` (the pattern used everywhere before this fix) silently
      # checks zero files against this workspace's solution-style
      # tsconfig.json (`files: [], include: [], references: [...]`),
      # which plain `tsc -p` doesn't follow. Every project now typechecks
      # for real, including `infra`'s CDK stacks.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
